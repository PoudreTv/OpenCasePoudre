<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poudre Cases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c0e;
    --panel:#14171a;
    --panel2:#1b1f23;
    --line:#262b2f;
    --accent:#7ed9a0;
    --accent-dark:#4fae76;
    --text:#e9ece9;
    --text2:#8b958f;
    --commun:#8a94a0;
    --peu:#4f8fd1;
    --rare:#8a5cd9;
    --epique:#c94fc0;
    --legend:#e0a83a;
    --myth:#e0473f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .auth-container {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 30px;
    border-radius: 8px;
    width: 100%;
    max-width: 400px;
  }
  h2 {
    font-family: 'Oswald', sans-serif;
    margin-top: 0;
    color: var(--accent);
  }
  .form-group {
    margin-bottom: 15px;
  }
  label {
    display: block;
    margin-bottom: 5px;
    color: var(--text2);
    font-size: 14px;
  }
  input {
    width: 100%;
    padding: 10px;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text);
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    border: none;
    border-radius: 4px;
    color: var(--bg);
    font-weight: 600;
    cursor: pointer;
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
  }
  button:hover {
    background: var(--accent-dark);
  }
  .error-msg {
    color: var(--myth);
    font-size: 14px;
    margin-top: 10px;
  }
  .success-msg {
    color: var(--accent);
    font-size: 14px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="auth-container">
  <h2>Créer un compte</h2>
  <div class="form-group">
    <label for="pseudo">Pseudo</label>
    <input type="text" id="pseudo" placeholder="Votre pseudo">
  </div>
  <div class="form-group">
    <label for="password">Mot de passe</label>
    <input type="password" id="password" placeholder="******">
  </div>
  <button id="btn-register">S'inscrire</button>
  <div id="message"></div>
</div>

<!-- CONFIGURATION ET LOGIQUE FIREBASE SÉCURISÉE -->
<script type="module">
  // 1. Importation correcte des modules Firebase
  import { initializeApp } from "https://gstatic.com";
  import { getAuth, signInAnonymously } from "https://gstatic.com";
  import { getFirestore, doc, setDoc } from "https://gstatic.com";

  // 2. Vos configurations Firebase intégrées
  const firebaseConfig = {
    apiKey: "AIzaSyDIDZxdaZu04B1nFQNGxRK9sCul8c4iDdE",
    authDomain: "site-caseopeningpoudre.firebaseapp.com",
    projectId: "site-caseopeningpoudre",
    storageBucket: "site-caseopeningpoudre.firebasestorage.app",
    messagingSenderId: "321569665170",
    appId: "1:321569665170:web:0b38a96488579f1086364b"
  };

  // Initialisation de Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // 3. Gestion du bouton d'inscription (Uniquement Pseudo / Mot de passe)
  document.getElementById('btn-register').addEventListener('click', async () => {
    const pseudo = document.getElementById('pseudo').value.trim();
    const password = document.getElementById('password').value;
    const messageDiv = document.getElementById('message');

    messageDiv.innerHTML = "";

    if(!pseudo || !password) {
      messageDiv.innerHTML = `<p class="error-msg">Veuillez remplir tous les champs.</p>`;
      return;
    }

    if(password.length < 6) {
      messageDiv.innerHTML = `<p class="error-msg">Le mot de passe doit contenir au moins 6 caractères.</p>`;
      return;
    }

    try {
      // Étape A : Création de la connexion anonyme sécurisée
      const userCredential = await signInAnonymously(auth);
      const user = userCredential.user;

      // Étape B : Enregistrement du pseudo dans Firestore
      await setDoc(doc(db, "poudrecases", user.uid), {
        pseudo: pseudo,
        password: password,
        createdAt: new Date().toISOString()
      });

      messageDiv.innerHTML = `<p class="success-msg">Compte créé avec succès ! Bienvenue ${pseudo}.</p>`;
      
      document.getElementById('pseudo').value = "";
      document.getElementById('password').value = "";

    } catch (error) {
      console.error("Erreur d'inscription :", error);
      messageDiv.innerHTML = `<p class="error-msg">Une erreur est survenue lors de l'inscription.</p>`;
    }
  });
</script>

</body>
</html>
