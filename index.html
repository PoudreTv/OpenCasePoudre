  .auth-container {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 30px;
    border-radius: 8px;
    width: 100%;
    max-width: 400px;
  }

    font-family: 'Oswald', sans-serif;
    margin-top: 0;
    color: var(--accent);
  }

    margin-bottom: 15px;
  }

    display: block;
    margin-bottom: 5px;
    color: var(--text2);
    font-size: 14px;
  }
  input {
    width: 100%;
    padding: 10px;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text);
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }

    width: 100%;
    padding: 12px;
    background: var(--accent);
    border: none;
    border-radius: 4px;
    color: var(--bg);
    font-weight: 600;
    cursor: pointer;
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
  }
  button:hover {
    background: var(--accent-dark);
  }
  .error-msg {
    color: var(--myth);
    font-size: 14px;
    margin-top: 10px;
  }
  .success-msg {
    color: var(--accent);
    font-size: 14px;
    margin-top: 10px;
  }

<body>

<div class="auth-container">
  <h2>Créer un compte</h2>
  <div class="form-group">
    <label for="pseudo">Pseudo</label>
    <input type="text" id="pseudo" placeholder="Votre pseudo">
  </div>
  <div class="form-group">
    <label for="password">Mot de passe</label>
    <input type="password" id="password" placeholder="******">
  </div>
  <button id="btn-register">S'inscrire</button>
  <div id="message"></div>
</div>
