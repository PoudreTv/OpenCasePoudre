<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poudre Cases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://googleapis.com" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c0e;
    --panel:#14171a;
    --panel2:#1b1f23;
    --line:#262b2f;
    --accent:#7ed9a0;
    --accent-dark:#4fae76;
    --text:#e9ece9;
    --text2:#8b958f;
    --commun:#8a94a0;
    --peu:#4f8fd1;
    --rare:#8a5cd9;
    --epique:#c94fc0;
    --legend:#e0a83a;
    --myth:#e0473f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: #0a0c0e; /* Simplifié pour l'affichage */
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .auth-container {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 30px;
    border-radius: 8px;
    width: 100%;
    max-width: 400px;
  }
  h2 {
    font-family: 'Oswald', sans-serif;
    margin-top: 0;
    color: var(--accent);
  }
  .form-group {
    margin-bottom: 15px;
  }
  label {
    display: block;
    margin-bottom: 5px;
    color: var(--text2);
    font-size: 14px;
  }
  input {
    width: 100%;
    padding: 10px;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text);
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    border: none;
    border-radius: 4px;
    color: var(--bg);
    font-weight: 600;
    cursor: pointer;
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
  }
  button:hover {
    background: var(--accent-dark);
  }
  .error-msg {
    color: var(--myth);
    font-size: 14px;
    margin-top: 10px;
  }
  .success-msg {
    color: var(--accent);
    font-size: 14px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="auth-container">
  <h2>Créer un compte</h2>
  <div class="form-group">
    <label for="pseudo">Pseudo</label>
    <input type="text" id="pseudo" placeholder="Votre pseudo">
  </div>
  <div class="form-group">
    <label for="email">Adresse Email</label>
    <input type="email" id="email" placeholder="exemple@mail.com">
  </div>
  <div class="form-group">
    <label for="password">Mot de passe</label>
    <input type="password" id="password" placeholder="******">
  </div>
  <button id="btn-register">S'inscrire</button>
  <div id="message"></div>
</div>

<!-- CONFIGURATION ET LOGIQUE FIREBASE SÉCURISÉE -->
<script type="module">
  // 1. Importation des modules Firebase nécessaires
  import { initializeApp } from "https://gstatic.com";
  import { getAuth, createUserWithEmailAndPassword } from "https://gstatic.com";
  import { getFirestore, doc, setDoc } from "https://gstatic.com";

  // 2. METTEZ VOS PROPRES CONFIGURATIONS FIREBASE ICI
  const firebaseConfig = {
    apiKey: "VOTRE_API_KEY",
    authDomain: "VOTRE_AUTH_DOMAIN",
    projectId: "VOTRE_PROJECT_ID",
    storageBucket: "VOTRE_STORAGE_BUCKET",
    messagingSenderId: "VOTRE_MESSAGING_SENDER_ID",
    appId: "VOTRE_APP_ID"
  };

  // Initialisation de Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // 3. Gestion du clic sur le bouton d'inscription
  document.getElementById('btn-register').addEventListener('click', async () => {
    const pseudo = document.getElementById('pseudo').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const messageDiv = document.getElementById('message');

    // Réinitialisation des messages
    messageDiv.innerHTML = "";

    if(!pseudo || !email || !password) {
      messageDiv.innerHTML = `<p class="error-msg">Veuillez remplir tous les champs.</p>`;
      return;
    }

    try {
      // Étape A : Création du compte sécurisé dans Firebase Authentication
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // Étape B : Enregistrement du pseudo dans Firestore (Collection: poudrecases)
      // On utilise user.uid comme ID du document pour correspondre à nos règles de sécurité !
      await setDoc(doc(db, "poudrecases", user.uid), {
        pseudo: pseudo,
        email: email,
        createdAt: new Date().toISOString()
      });

      messageDiv.innerHTML = `<p class="success-msg">Compte créé avec succès ! Bienvenue ${pseudo}.</p>`;
      
      // Optionnel : Vider les champs
      document.getElementById('pseudo').value = "";
      document.getElementById('email').value = "";
      document.getElementById('password').value = "";

    } catch (error) {
      console.error("Erreur d'inscription :", error);
      let errorMessage = "Une erreur est survenue lors de l'inscription.";
      
      // Traduction des erreurs courantes de Firebase
      if (error.code === 'auth/email-already-in-use') errorMessage = "Cette adresse email est déjà utilisée.";
      if (error.code === 'auth/weak-password') errorMessage = "Le mot de passe doit contenir au moins 6 caractères.";
      if (error.code === 'auth/invalid-email') errorMessage = "L'adresse email n'est pas valide.";
      
      messageDiv.innerHTML = `<p class="error-msg">${errorMessage}</p>`;
    }
  });
</script>

</body>
</html>
